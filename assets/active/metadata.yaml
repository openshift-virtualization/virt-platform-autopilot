  # Phase 1: KubeVirt Metrics Exporter - per-node DaemonSet collecting VM storage
  # I/O latency via QMP, QGA and eBPF.
  # Opt-in via: platform.kubevirt.io/enable-kubevirt-metrics-exporter=true
  # Assets are split by CRD dependency so soft dependencies work correctly:
  # core resources (always available), SCC (security.openshift.io), PodMonitor +
  # PrometheusRule (monitoring.coreos.com), and Perses dashboard (perses.dev).
  #
  # Reconcile order: namespace (1) -> RBAC -> SCC prerequisites (2) -> DaemonSet (3)

  - name: kubevirt-metrics-exporter-namespace
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/namespace.yaml
    phase: 1
    install: opt-in
    component: Namespace
    reconcile_order: 1
    conditions: &kubevirt-metrics-exporter-conditions
      - type: annotation
        key: platform.kubevirt.io/enable-kubevirt-metrics-exporter
        value: "true"
      - type: image
        key: kubevirt-metrics-exporter

  - name: kubevirt-metrics-exporter-serviceaccount
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/serviceaccount.yaml
    phase: 1
    install: opt-in
    component: ServiceAccount
    reconcile_order: 2
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-clusterrole
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/clusterrole.yaml
    phase: 1
    install: opt-in
    component: ClusterRole
    reconcile_order: 2
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-clusterrolebinding
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/clusterrolebinding.yaml
    phase: 1
    install: opt-in
    component: ClusterRoleBinding
    reconcile_order: 2
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-scc
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/scc.yaml
    phase: 1
    install: opt-in
    component: SecurityContextConstraints
    reconcile_order: 2
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-scc-clusterrole
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/scc-clusterrole.yaml
    phase: 1
    install: opt-in
    component: ClusterRole
    reconcile_order: 2
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-scc-clusterrolebinding
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/scc-clusterrolebinding.yaml
    phase: 1
    install: opt-in
    component: ClusterRoleBinding
    reconcile_order: 2
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/kubevirt-metrics-exporter.yaml.tpl
    phase: 1
    install: opt-in
    component: DaemonSet
    reconcile_order: 3
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-podmonitor
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/podmonitor.yaml
    phase: 1
    install: opt-in
    component: PodMonitor
    reconcile_order: 3
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-prometheusrule
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/prometheusrule.yaml
    phase: 1
    install: opt-in
    component: PrometheusRule
    reconcile_order: 3
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-datasource
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/datasource.yaml
    phase: 1
    install: opt-in
    component: PersesDatasource
    reconcile_order: 3
    conditions: *kubevirt-metrics-exporter-conditions

  - name: kubevirt-metrics-exporter-dashboard
    group: kubevirt-metrics-exporter
    path: active/kubevirt-metrics-exporter/dashboard.yaml
    phase: 1
    install: opt-in
    component: PersesDashboard
    reconcile_order: 3
    conditions: *kubevirt-metrics-exporter-conditions
  
  - name: vm-drain-shutdown-inhibitor
    path: active/machine-config/99-vm-drain-shutdown-inhibitor.yaml.tpl
    phase: 2
    install: opt-in
    component: MachineConfig
    reconcile_order: 1
    template_params:
      role: worker
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-vm-drain-shutdown-inhibitor
        value: "true"

  - name: vm-drain-shutdown-inhibitor-master
    path: active/machine-config/99-vm-drain-shutdown-inhibitor.yaml.tpl
    phase: 2
    install: opt-in
    component: MachineConfig
    reconcile_order: 1
    template_params:
      role: master
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-vm-drain-shutdown-inhibitor
        value: "true"
      - type: topology
        field: hasSchedulableMasters

  # SBR detection-mode config. Auto-detects sharedStorageClass from CDI StorageProfiles
  # (picks alphabetically first RWX Filesystem class). Omits field when none found.
  # Admin should set platform.kubevirt.io/sbr-storage-class on HCO if multiple RWX classes exist.
  # Opt-in (tech preview): requires platform.kubevirt.io/enable-node-remediation annotation.
  - name: sbr-detection-config
    path: active/node-remediation/storage-based-remediation-config.yaml.tpl
    gate_crd: storagebasedremediationconfigs.storage-based-remediation.medik8s.io
    phase: 1
    install: opt-in
    component: StorageBasedRemediationConfig
    reconcile_order: 1
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-node-remediation
        value: "true"

  # NHC with FAR remediator. User must create fenceagentsremediationtemplate-default
  # in openshift-workload-availability with BMC credentials.
  - name: nhc-far
    path: active/node-remediation/nhc-far.yaml
    gate_crd: nodehealthchecks.remediation.medik8s.io
    phase: 1
    install: opt-in
    component: NodeHealthCheck
    reconcile_order: 2
    conditions:
      - type: annotation
        key: platform.kubevirt.io/enable-node-remediation
        value: "true"

  # Phase 2: Opt-in - Advanced features
  # TODO: Implement these assets:
  # - vfio-assign (machine-config/04-vfio-assign.yaml.tpl)
  # - aaq-operator (operators/aaq.yaml.tpl)
  # - node-maintenance-operator (operators/node-maintenance.yaml.tpl)
  # - fence-agents-operator (operators/fence-agents.yaml.tpl)
  # - usb-passthrough (machine-config/05-usb-passthrough.yaml.tpl)

# Framework-level maturity. The autopilot is GA: enabled by default (opt-out via
# platform.kubevirt.io/autopilot=false), so no opt_in gate is declared.
framework:
  maturity: ga

# Feature catalog: maps user-facing features to assets/groups.
# - maturity is required only for opt-in features ("dp" or "tp")
# - features whose assets are all install: always are auto-classified as GA
# - opt-in conditions are derived from the referenced assets (no duplication)
# - every asset must be covered by a feature entry or listed in excluded_assets

# Assets intentionally excluded from feature tracking (e.g. internal-only,
# not yet user-facing, or managed externally).
excluded_assets:
  - hco-golden-config

features:
  - name: Swap Enablement
    description: Enables OpenShift worker nodes to safely use swap for virtualization workloads; swap requires pre-provisioned dedicated storage to be available
    assets: [swap-enable]

  - name: Kubelet Performance
    description: Optimized kubelet settings for virtualization workloads
    maturity: tp
    assets: [kubelet-perf-settings]

  - name: Observability Enhancements
    description: Enhanced observability with additional Prometheus alerting rules and advanced Perses dashboards in the OpenShift console
    assets: [metrics-service, metrics-servicemonitor, prometheus-alerts, monitoring-ui-plugin, autopilot-dashboard]
    requires:
      - Cluster Observability Operator

  - name: Load-Aware Descheduler
    description: Load-aware VM balancing based on CPU/memory utilization and pressure stall metrics
    assets: [descheduler-loadaware, psi-enable, psi-enable-master, descheduler-dashboard]
    requires:
      - Kube Descheduler Operator

  - name: PCI Passthrough
    description: GPU/PCI device passthrough via VFIO
    maturity: dp
    assets: [pci-passthrough]

  - name: CPU Manager
    description: Dedicated CPU pinning for guaranteed QoS workloads
    maturity: dp
    assets: [kubelet-cpu-manager]

  - name: MTV Operator
    description: Migration Toolkit for Virtualization
    maturity: dp
    assets: [mtv-operator]

  - name: MetalLB Operator
    description: Bare-metal load balancer for services
    maturity: dp
    assets: [metallb-operator]

  - name: Logging
    description: Integrated logging stack with LokiStack and ClusterLogForwarder
    maturity: dp
    groups: [logging, audit-logging]
    requires:
      - Loki Operator
      - Red Hat OpenShift Logging Operator

  - name: Troubleshooting Panel
    description: Korrel8r observability signal correlation in the console
    maturity: dp
    assets: [troubleshooting-panel-ui-plugin]
    requires:
      - Cluster Observability Operator

  - name: KubeVirt Metrics Exporter
    description: Per-node VM storage I/O latency collection via QMP, QGA, and eBPF, and detailed KVM and memory statistics
    maturity: dp
    groups: [kubevirt-metrics-exporter]
    recommended:
      - Cluster Observability Operator

  - name: In-Flight Operations
    description: OperationRuleSet-based coordination for safe concurrent operations
    maturity: tp
    groups: [inflightoperations]

  - name: Kernel Samepage Merging (KSM) zero pages only
    description: Node-level KSM tuning that enables zero-pages-only deduplication with adaptive scan rate
    maturity: dp
    groups: [ksm-zero-only]

  - name: Transparent Huge Pages (THP) Tuning
    description: Node-level THP tuning that sets madvise mode and khugepaged scan rate for KVM guest memory
    maturity: dp
    groups: [thp-tuning]

  - name: NHC with FAR remediator and SBR detection-mode config
    description: Node health checks with fence-agents remediation and storage-based remediation in detection-only mode
    maturity: dp
    assets: [nhc-far, sbr-detection-config]
    requires:
      - Node Health Check Operator
      - Fence Agents Remediation Operator
      - Storage Based Remediation Operator

  - name: VM drain shutdown inhibitor
    description: Attempts to gracefully shutdown KubeVirt VMs before allowing the node to shut down
    maturity: dp
    assets: [vm-drain-shutdown-inhibitor, vm-drain-shutdown-inhibitor-master]
