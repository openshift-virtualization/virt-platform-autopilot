apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubevirt-metrics-exporter-alerts
  namespace: kubevirt-metrics-exporter
  labels:
    app.kubernetes.io/name: kubevirt-metrics-exporter
spec:
  groups:
    # Admin signals. One series per storage class and operation.
    # Histogram signals count a VMI when more than 1% of operations are
    # slower than the bucket and the series has at least 100 operations
    # in 5m. Buckets are 10ms, 100ms, and 1s. Read/write and block use
    # 100ms. Flush and NFS use 1s: 500ms and 250ms fall inside the
    # 100ms–1s bucket and are not measurable. Guest latency is an average
    # above 100ms. Fires when more than 10 VMIs are affected, or more
    # than 10% of active VMIs are affected and at least 3 are.
    - name: kubevirt-storage-io.rules
      rules:
        - record: storageclass:kme_vmi_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  (
                    (
                      sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                        rate(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
                      )
                      -
                      sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                        rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write",le="0.1"}[5m])
                      )
                    )
                    /
                    sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                      rate(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
                    )
                  ) > 0.01
                  and
                  sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                    increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
                  ) > 100
                )
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_vmi_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  sum by (namespace, name, persistentvolumeclaim, operation) (
                    increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
                  ) > 100
                )
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_vmi_flush_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  (
                    (
                      sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                        rate(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[5m])
                      )
                      -
                      sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                        rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation="flush",le="1"}[5m])
                      )
                    )
                    /
                    sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                      rate(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[5m])
                    )
                  ) > 0.01
                  and
                  sum by (namespace, name, disk, persistentvolumeclaim, operation) (
                    increase(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[5m])
                  ) > 100
                )
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_vmi_flush_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  sum by (namespace, name, persistentvolumeclaim, operation) (
                    increase(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[5m])
                  ) > 100
                )
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_block_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  (
                    (
                      (
                        sum by (namespace, pod, persistentvolumeclaim, operation) (
                          rate(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
                        )
                        -
                        sum by (namespace, pod, persistentvolumeclaim, operation) (
                          rate(kme_block_io_latency_seconds_bucket{operation=~"read|write",le="0.1"}[5m])
                        )
                      )
                      /
                      sum by (namespace, pod, persistentvolumeclaim, operation) (
                        rate(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
                      )
                    ) > 0.01
                    and
                    sum by (namespace, pod, persistentvolumeclaim, operation) (
                      increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
                    ) > 100
                  )
                  * on (namespace, persistentvolumeclaim) group_left(storageclass)
                    max by (namespace, persistentvolumeclaim, storageclass) (
                      kube_persistentvolumeclaim_info{storageclass!=""}
                    )
                )
                * on (namespace, pod) group_left(name)
                  label_replace(
                    max by (namespace, vmi_pod, name) (
                      kubevirt_vmi_info{phase="running",vmi_pod!=""}
                    ),
                    "pod", "$1", "vmi_pod", "(.*)"
                  )
              )
            )

        - record: storageclass:kme_block_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  (
                    sum by (namespace, pod, persistentvolumeclaim, operation) (
                      increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
                    ) > 100
                  )
                  * on (namespace, persistentvolumeclaim) group_left(storageclass)
                    max by (namespace, persistentvolumeclaim, storageclass) (
                      kube_persistentvolumeclaim_info{storageclass!=""}
                    )
                )
                * on (namespace, pod) group_left(name)
                  label_replace(
                    max by (namespace, vmi_pod, name) (
                      kubevirt_vmi_info{phase="running",vmi_pod!=""}
                    ),
                    "pod", "$1", "vmi_pod", "(.*)"
                  )
              )
            )

        - record: storageclass:kme_nfs_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  (
                    (
                      (
                        sum by (namespace, pod, persistentvolumeclaim, operation) (
                          rate(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
                        )
                        -
                        sum by (namespace, pod, persistentvolumeclaim, operation) (
                          rate(kme_nfs_io_latency_seconds_bucket{operation=~"read|write",le="1"}[5m])
                        )
                      )
                      /
                      sum by (namespace, pod, persistentvolumeclaim, operation) (
                        rate(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
                      )
                    ) > 0.01
                    and
                    sum by (namespace, pod, persistentvolumeclaim, operation) (
                      increase(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
                    ) > 100
                  )
                  * on (namespace, persistentvolumeclaim) group_left(storageclass)
                    max by (namespace, persistentvolumeclaim, storageclass) (
                      kube_persistentvolumeclaim_info{storageclass!=""}
                    )
                )
                * on (namespace, pod) group_left(name)
                  label_replace(
                    max by (namespace, vmi_pod, name) (
                      kubevirt_vmi_info{phase="running",vmi_pod!=""}
                    ),
                    "pod", "$1", "vmi_pod", "(.*)"
                  )
              )
            )

        - record: storageclass:kme_nfs_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (
                  (
                    sum by (namespace, pod, persistentvolumeclaim, operation) (
                      increase(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
                    ) > 100
                  )
                  * on (namespace, persistentvolumeclaim) group_left(storageclass)
                    max by (namespace, persistentvolumeclaim, storageclass) (
                      kube_persistentvolumeclaim_info{storageclass!=""}
                    )
                )
                * on (namespace, pod) group_left(name)
                  label_replace(
                    max by (namespace, vmi_pod, name) (
                      kubevirt_vmi_info{phase="running",vmi_pod!=""}
                    ),
                    "pod", "$1", "vmi_pod", "(.*)"
                  )
              )
            )

        - record: storageclass:kme_guest_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                (kubevirt_vmi_storage_guest_latency_avg_seconds > 0.1)
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_guest_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                kubevirt_vmi_storage_guest_latency_avg_seconds
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{storageclass!=""}
                  )
              )
            )

    - name: kubevirt-storage-io
      rules:
        - alert: StorageClassVMILatencyHigh
          expr: |
            storageclass:kme_vmi_io_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_vmi_io_latency_affected:count > 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_vmi_io_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_vmi_io_latency_active:count
                ) > 0.1
                and on (storageclass, operation)
                storageclass:kme_vmi_io_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have more than 1% of {{ $labels.operation }} operations slower than 100ms. Fires when more than 10 VMIs are affected, or more than 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassVMIFlushLatencyHigh
          expr: |
            storageclass:kme_vmi_flush_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_vmi_flush_latency_affected:count > 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_vmi_flush_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_vmi_flush_latency_active:count
                ) > 0.1
                and on (storageclass, operation)
                storageclass:kme_vmi_flush_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High flush latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have more than 1% of flush operations slower than 1s. Durability-sensitive workloads on this storage will see slow commits. Fires when more than 10 VMIs are affected, or more than 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassBlockLatencyHigh
          expr: |
            storageclass:kme_block_io_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_block_io_latency_affected:count > 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_block_io_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_block_io_latency_active:count
                ) > 0.1
                and on (storageclass, operation)
                storageclass:kme_block_io_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High block {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have more than 1% of block {{ $labels.operation }} operations slower than 100ms. Fires when more than 10 VMIs are affected, or more than 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassNFSLatencyHigh
          expr: |
            storageclass:kme_nfs_io_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_nfs_io_latency_affected:count > 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_nfs_io_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_nfs_io_latency_active:count
                ) > 0.1
                and on (storageclass, operation)
                storageclass:kme_nfs_io_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High NFS {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have more than 1% of NFS {{ $labels.operation }} operations slower than 1s. Fires when more than 10 VMIs are affected, or more than 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassGuestLatencyHigh
          expr: |
            storageclass:kme_guest_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_guest_latency_affected:count > 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_guest_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_guest_latency_active:count
                ) > 0.1
                and on (storageclass, operation)
                storageclass:kme_guest_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High guest {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have average guest {{ $labels.operation }} latency above 100ms. Fires when more than 10 VMIs are affected, or more than 10% of VMIs reporting guest latency on that storage class are affected and at least 3 are affected."

        - alert: NodeVMStorageLatencyWidespread
          expr: |
            (
              count by (node) (
                histogram_quantile(0.99, sum by (namespace, name, node, le) (
                  rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write"}[5m])
                )) > 0.1
              )
            )
            /
            count by (node) (
              sum by (namespace, name, node) (
                rate(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) > 0
            ) > 0.5
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Widespread VM storage latency on node {{ $labels.node }}"
            description: >-
              More than 50% of active VMs on node {{ $labels.node }} have P99 storage
              I/O latency exceeding 100ms, suggesting a node- or storage-infrastructure
              problem rather than a single workload issue.

        - alert: VMIDiskSaturated
          expr: |
            sum by (namespace, name, node, disk, persistentvolumeclaim, bus) (
              kubevirt_vmi_storage_queue_inuse
            )
            /
            (
              sum by (namespace, name, node, disk, persistentvolumeclaim, bus) (
                kubevirt_vmi_storage_queue_size
              ) > 0
            ) > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Virtqueues saturated on {{ $labels.namespace }}/{{ $labels.name }} (bus={{ $labels.bus }}{{ if $labels.disk }}, disk={{ $labels.disk }}{{ end }})"
            description: >-
              Aggregate virtqueue occupancy (bus={{ $labels.bus }}{{ if $labels.disk }},
              disk={{ $labels.disk }}, PVC={{ $labels.persistentvolumeclaim }}{{ end }}) on VM
              {{ $labels.namespace }}/{{ $labels.name }} exceeds 90% across all
              queues, indicating sustained storage backpressure.

    - name: kubevirt-overhead
      rules:
        - alert: KSMDCPUHigh
          expr: |
            rate(kme_cgroup_ksmd_cpu_seconds_total[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ksmd consuming >50% CPU on node {{ $labels.node }}"
            description: >-
              The ksmd kernel thread on node {{ $labels.node }} has been using
              more than 50% of a CPU core for over 10 minutes. This may indicate
              overly aggressive KSM scan parameters (pages_to_scan / sleep_millisecs)
              or a large volume of volatile pages causing excessive re-scanning.

        - alert: KhugepagedCPUHigh
          expr: |
            rate(kme_cgroup_khugepaged_cpu_seconds_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "khugepaged consuming >10% CPU on node {{ $labels.node }}"
            description: >-
              The khugepaged kernel thread on node {{ $labels.node }} has been
              using more than 10% of a CPU core for over 10 minutes. This may
              indicate excessive transparent huge page collapse activity, possibly
              due to a large number of VMs faulting memory simultaneously.

    # The job label must match the PodMonitor name in deploy/podmonitor/podmonitor.yaml.
    - name: kubevirt-metrics-exporter-health
      rules:
        - alert: KMEQMPPollStale
          expr: time() - kme_qmp_last_poll_timestamp_seconds > 150
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "QMP polling stale on {{ $labels.instance }}"
            description: >-
              The QMP subsystem has not completed a poll cycle in over 5 minutes.
              VM storage metrics from this node may be stale.

        - alert: KMEQGAPollStale
          expr: time() - kme_qga_last_poll_timestamp_seconds > 150
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "QGA polling stale on {{ $labels.instance }}"
            description: >-
              The QGA subsystem has not completed a poll cycle in over 5 minutes.
              Guest-side metrics from this node may be stale.

        - alert: KMEQMPScrapeErrors
          expr: |
            rate(kme_qmp_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sustained QMP scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent QMP scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing storage metrics.

        - alert: KMEQGAScrapeErrors
          expr: |
            rate(kme_qga_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sustained QGA scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent QGA scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing guest-side metrics.

        - alert: KMEKVMPollStale
          expr: time() - kme_kvm_last_poll_timestamp_seconds > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "KVM polling stale on {{ $labels.instance }}"
            description: >-
              The KVM subsystem has not completed a poll cycle in over 90 seconds.
              KVM exit/hypercall metrics from this node may be stale.

        - alert: KMEKVMScrapeErrors
          expr: |
            rate(kme_kvm_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sustained KVM scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent KVM debugfs scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing KVM metrics.

        - alert: KMECgroupPollStale
          expr: time() - kme_cgroup_last_poll_timestamp_seconds > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cgroup polling stale on {{ $labels.instance }}"
            description: >-
              The cgroup subsystem has not completed a poll cycle in over 90 seconds.
              VMI memory and kernel thread CPU metrics from this node may be stale.

        - alert: KMECgroupScrapeErrors
          expr: |
            rate(kme_cgroup_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Sustained cgroup scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent cgroup scrape errors
              (>0.1/s over 15 minutes). Some VMIs may be missing memory metrics.

        - alert: KMEeBPFSubsystemDown
          expr: kme_subsystem_active{subsystem="block"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "eBPF block subsystem down on {{ $labels.instance }}"
            description: >-
              The block eBPF subsystem failed to load or has stopped.
              Node-side block I/O latency metrics are missing.

        - alert: KMEAbsent
          expr: absent(up{job="kubevirt-metrics-exporter"} == 1)
          # job label is set via jobLabel: app in the PodMonitor
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "kubevirt-metrics-exporter is down"
            description: >-
              No kubevirt-metrics-exporter metrics are being scraped. The
              DaemonSet may be down or the PodMonitor/scrape config broken.
