# Strict tests: configuration-only firing, fifteen-minute delay, recovery, and exclusion.
# Rules are generated by hack/test-alert-rules.sh from the asset template.
rule_files:
- prometheus-rules.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: kubevirt_autopilot_render_failed{asset="logging-lokistack",reason="configuration",code="NoDefaultStorageClass"}
    values: 1+0x15 0 0
  alert_rule_test:
  - eval_time: 5m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
  - eval_time: 14m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
  - eval_time: 15m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts:
    - &id001
      exp_labels:
        severity: warning
        namespace: placeholder
        operator: virt-platform-autopilot
        kubernetes_operator_part_of: kubevirt
        kubernetes_operator_component: autopilot
        operator_health_impact: warning
        asset: logging-lokistack
        reason: configuration
        code: NoDefaultStorageClass
      exp_annotations:
        summary: Autopilot logging storage is not configured for logging-lokistack
        description: 'virt-platform-autopilot cannot configure Loki block storage for logging-lokistack:

          no explicit storage class, existing LokiStack storage class,

          or cluster default StorageClass is available.


          Set platform.kubevirt.io/logging-storage-class on HyperConverged

          to a suitable StorageClass, or configure a cluster default.

          Inspect RenderFailed events on HyperConverged for details.'
        runbook_url: placeholder
  - eval_time: 16m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
- interval: 1m
  input_series:
  - series: kubevirt_autopilot_render_failed{asset="logging-lokistack",reason="configuration",code="NoDefaultStorageClass"}
    values: 1+0x15 stale _
  alert_rule_test:
  - eval_time: 15m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts:
    - *id001
  - eval_time: 16m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
- interval: 1m
  input_series:
  - series: kubevirt_autopilot_render_failed{asset="logging-lokistack",reason="internal",code=""}
    values: 1+0x20
  - series: kubevirt_autopilot_render_failed{asset="another-asset",reason="configuration",code="NoDefaultStorageClass"}
    values: 1+0x20
  - series: kubevirt_autopilot_render_failed{asset="logging-lokistack",reason="configuration",code="DifferentProblem"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 20m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []

# A configuration problem corrected during setup must never reach firing state.
- interval: 1m
  input_series:
  - series: kubevirt_autopilot_render_failed{asset="logging-lokistack",reason="configuration",code="NoDefaultStorageClass"}
    values: 1+0x9 0+0x10
  alert_rule_test:
  - eval_time: 9m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
  - eval_time: 15m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
  - eval_time: 20m
    alertname: VirtPlatformAutopilotLoggingStorageNotConfigured
    exp_alerts: []
