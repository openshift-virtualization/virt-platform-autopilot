name: Check GA Asset E2E Coverage

on:
  pull_request:
    paths:
      - 'assets/active/metadata.yaml'
      - 'test/e2e/assets_test.go'

jobs:
  check-ga-coverage:
    name: GA assets covered by assetsUnderTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check GA asset E2E coverage
        run: python3 scripts/check-ga-coverage.py
