name: Verify Generated Files

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify CRDs and RBAC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history so the PR base is available for the changed-files diff.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # On push (e.g. to main) verify every CRD against upstream. On a PR, gate
      # only on CRDs the PR actually changed — unrelated upstream drift is the
      # daily "Update CRDs" workflow's job, not a reason to block an unrelated PR.
      - name: Verify CRDs are up-to-date
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            make verify-crds
            exit $?
          fi

          changed=$(git diff --name-only "$BASE_SHA" HEAD -- 'test/crds/' | grep -E '\.ya?ml$' || true)
          if [ -z "$changed" ]; then
            echo "No CRD files changed in this PR; skipping upstream CRD verification."
            exit 0
          fi

          echo "CRD files changed in this PR:"
          echo "$changed" | sed 's/^/  - /'
          export CRD_VERIFY_PATHS="$changed"
          make verify-crds

      - name: Verify RBAC is up-to-date
        run: make verify-rbac

      - name: Verify feature status is up-to-date
        run: make verify-feature-status

      # Save PR number so the comment workflow (running with write access in the
      # base-repo context) can look it up — artifact is the only safe channel
      # across the pull_request / workflow_run boundary for fork PRs.
      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload PR number artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr_number.txt
