apiVersion: hco.kubevirt.io/v1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
  annotations:
    # The autopilot is GA and enabled by default; no annotation is required to
    # activate it. Set it to "false" to opt out and disable the autopilot entirely:
    #   platform.kubevirt.io/autopilot: "false"
    # Per-asset opt-in logic (conditions, hardware detection, feature gates,
    # CRD presence) still governs which assets are actually applied.
    platform.kubevirt.io/autopilot: "true"
spec:
  featureGates:
    - name: deployKubeSecondaryDNS
