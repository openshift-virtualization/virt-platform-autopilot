apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cnv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virt-platform-autopilot
  namespace: openshift-cnv
  labels:
    app: virt-platform-autopilot
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      app: virt-platform-autopilot
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        app: virt-platform-autopilot
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: system-cluster-critical
      containers:
        - name: manager
          image: quay.io/openshift-virtualization/virt-platform-autopilot:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --namespace=openshift-cnv
            - --metrics-bind-address=:8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: metrics-serving-cert
              mountPath: /etc/tls/private
              readOnly: true
      serviceAccountName: virt-platform-autopilot
      terminationGracePeriodSeconds: 30
      volumes:
        # Serving certificate minted by the OpenShift service-ca operator once the
        # metrics Service is reconciled; optional so the pod starts beforehand.
        - name: metrics-serving-cert
          secret:
            secretName: virt-platform-autopilot-metrics-tls
            optional: true
